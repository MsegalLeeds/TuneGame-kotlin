```
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TuneGame</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
    <style>
        :root {
          --bg: #0a0a0a;
          --surface: #141414;
          --surface2: #1e1e1e;
          --border: rgba(255,255,255,0.08);
          --text: #f0f0f0;
          --muted: #888;
          --green: #1DB954;
          --green-dim: rgba(29,185,84,0.15);
          --red: #e24b4a;
          --red-dim: rgba(226,75,74,0.15);
          --amber: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          background: var(--bg);
          color: var(--text);
          font-family: 'DM Sans', sans-serif;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 1rem;
        }

        .app {
          width: 100%;
          max-width: 420px;
        }

        .logo {
          font-family: 'Bebas Neue', sans-serif;
          font-size: 48px;
          letter-spacing: 0.05em;
          color: var(--green);
          text-align: center;
          line-height: 1;
          margin-bottom: 8px;
        }

        .tagline {
          text-align: center;
          color: var(--muted);
          font-size: 13px;
          margin-bottom: 32px;
        }

        /* ── screens ── */
        .screen { display: none; }
        .screen.active { display: block; }

        /* ── start screen ── */
        .start-card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 20px;
          padding: 32px;
          display: flex;
          flex-direction: column;
          gap: 16px;
        }

        .mode-label {
          font-size: 12px;
          font-weight: 500;
          color: var(--muted);
          text-transform: uppercase;
          letter-spacing: 0.08em;
          margin-bottom: 8px;
        }

        .mode-toggle {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 8px;
        }

        .mode-btn {
          background: var(--surface2);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 12px;
          color: var(--muted);
          font-family: 'DM Sans', sans-serif;
          font-size: 13px;
          cursor: pointer;
          transition: all 0.15s;
          text-align: center;
        }

        .mode-btn.active {
          background: var(--green-dim);
          border-color: var(--green);
          color: var(--green);
        }

        .playlist-status { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
        .playlist-status.custom { color: var(--green); }
        .playlist-row { display: flex; gap: 8px; margin-top: 8px; }
        .playlist-hint { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
        .playlist-msg { font-size: 12px; min-height: 16px; margin-top: 8px; }
        .playlist-msg.error { color: var(--red); }
        .playlist-msg.ok { color: var(--green); }

        .start-btn {
          background: var(--green);
          color: #000;
          border: none;
          border-radius: 12px;
          padding: 16px;
          font-family: 'Bebas Neue', sans-serif;
          font-size: 22px;
          letter-spacing: 0.1em;
          cursor: pointer;
          transition: opacity 0.15s, transform 0.1s;
          margin-top: 8px;
        }

        .start-btn:hover { opacity: 0.9; }
        .start-btn:active { transform: scale(0.98); }

        /* ── stats bar ── */
        .stats-bar {
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          gap: 8px;
          margin-bottom: 12px;
        }

        .stat-card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 10px 12px;
          text-align: center;
        }

        .stat-val {
          font-family: 'Bebas Neue', sans-serif;
          font-size: 26px;
          color: var(--text);
          line-height: 1;
        }

        .stat-lbl {
          font-size: 10px;
          color: var(--muted);
          text-transform: uppercase;
          letter-spacing: 0.06em;
          margin-top: 2px;
        }

        .lives-dots {
          display: flex;
          justify-content: center;
          gap: 5px;
          margin-bottom: 2px;
        }

        .life-dot {
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: var(--red);
          transition: background 0.3s;
        }

        .life-dot.lost { background: var(--surface2); border: 1px solid var(--border); }

        /* ── timer ── */
        .timer-track {
          height: 3px;
          background: var(--surface2);
          border-radius: 2px;
          overflow: hidden;
          margin-bottom: 14px;
        }

        .timer-bar {
          height: 100%;
          background: var(--green);
          border-radius: 2px;
          transition: width 1s linear, background 0.5s;
        }

        /* ── album art ── */
        .album-wrap {
          position: relative;
          width: 100%;
          aspect-ratio: 1;
          border-radius: 16px;
          overflow: hidden;
          margin-bottom: 16px;
          background: var(--surface2);
        }

        .album-img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: none;
        }

        .album-img.loaded { display: block; }

        .album-placeholder {
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .album-placeholder svg {
          width: 64px;
          height: 64px;
          opacity: 0.2;
        }

        .now-playing {
          position: absolute;
          bottom: 10px;
          left: 10px;
          background: rgba(0,0,0,0.7);
          backdrop-filter: blur(8px);
          border-radius: 8px;
          padding: 5px 10px;
          font-size: 11px;
          color: var(--green);
          display: flex;
          align-items: center;
          gap: 6px;
        }

        .pulse {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: var(--green);
          animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.4; transform: scale(0.7); }
        }

        /* ── question ── */
        .question-text {
          font-size: 16px;
          font-weight: 500;
          line-height: 1.5;
          margin-bottom: 16px;
          color: var(--text);
        }

        /* ── choices ── */
        .choices {
          display: flex;
          flex-direction: column;
          gap: 8px;
        }

        .choice-btn {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 13px 16px;
          display: flex;
          align-items: center;
          gap: 12px;
          cursor: pointer;
          transition: all 0.15s;
          width: 100%;
          text-align: left;
          font-family: 'DM Sans', sans-serif;
          font-size: 14px;
          color: var(--text);
        }

        .choice-btn:hover:not(:disabled) {
          border-color: rgba(255,255,255,0.2);
          background: var(--surface2);
        }

        .choice-btn:disabled { cursor: default; }

        .choice-btn.correct {
          background: var(--green-dim);
          border-color: var(--green);
          color: var(--green);
        }

        .choice-btn.wrong {
          background: var(--red-dim);
          border-color: var(--red);
          color: var(--red);
        }

        .choice-key {
          font-size: 11px;
          font-weight: 600;
          color: var(--muted);
          background: var(--surface2);
          border-radius: 5px;
          padding: 2px 7px;
          flex-shrink: 0;
        }

        .choice-btn.correct .choice-key {
          background: rgba(29,185,84,0.3);
          color: var(--green);
        }

        .choice-btn.wrong .choice-key {
          background: rgba(226,75,74,0.3);
          color: var(--red);
        }

        /* ── typed input ── */
        .typed-wrap {
          display: flex;
          gap: 8px;
          margin-top: 8px;
        }

        .typed-input {
          flex: 1;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 13px 16px;
          color: var(--text);
          font-family: 'DM Sans', sans-serif;
          font-size: 14px;
          outline: none;
          transition: border-color 0.15s;
        }

        .typed-input:focus { border-color: var(--green); }

        .submit-btn {
          background: var(--green);
          color: #000;
          border: none;
          border-radius: 12px;
          padding: 13px 20px;
          font-family: 'DM Sans', sans-serif;
          font-size: 14px;
          font-weight: 600;
          cursor: pointer;
          transition: opacity 0.15s;
        }

        .submit-btn:hover { opacity: 0.85; }

        /* ── result banner ── */
        .result-banner {
          border-radius: 12px;
          padding: 14px 16px;
          margin-top: 12px;
          display: none;
          flex-direction: column;
          gap: 4px;
        }

        .result-banner.show { display: flex; }
        .result-banner.correct { background: var(--green-dim); border: 1px solid var(--green); }
        .result-banner.wrong { background: var(--red-dim); border: 1px solid var(--red); }
        .result-banner.timeout { background: rgba(245,158,11,0.12); border: 1px solid var(--amber); }

        .result-title {
          font-family: 'Bebas Neue', sans-serif;
          font-size: 20px;
          letter-spacing: 0.05em;
        }

        .result-banner.correct .result-title { color: var(--green); }
        .result-banner.wrong .result-title { color: var(--red); }
        .result-banner.timeout .result-title { color: var(--amber); }

        .result-sub { font-size: 12px; color: var(--muted); }

        .next-btn {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 14px;
          color: var(--text);
          font-family: 'DM Sans', sans-serif;
          font-size: 14px;
          font-weight: 500;
          cursor: pointer;
          text-align: center;
          margin-top: 10px;
          transition: background 0.15s;
          width: 100%;
          display: none;
        }

        .next-btn.show { display: block; }
        .next-btn:hover { background: var(--surface2); }

        /* ── game over ── */
        .gameover-card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 20px;
          padding: 28px;
        }

        .gameover-header {
          text-align: center;
          margin-bottom: 24px;
        }

        .gameover-title {
          font-family: 'Bebas Neue', sans-serif;
          font-size: 42px;
          letter-spacing: 0.05em;
          color: var(--red);
          line-height: 1;
        }

        .gameover-score {
          font-family: 'Bebas Neue', sans-serif;
          font-size: 64px;
          color: var(--green);
          line-height: 1;
          margin: 4px 0;
        }

        .gameover-sub { font-size: 13px; color: var(--muted); }

        .leaderboard-title {
          font-size: 11px;
          font-weight: 500;
          color: var(--muted);
          text-transform: uppercase;
          letter-spacing: 0.08em;
          margin-bottom: 10px;
        }

        .lb-row {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 9px 0;
          border-bottom: 1px solid var(--border);
          font-size: 13px;
        }

        .lb-rank {
          font-family: 'Bebas Neue', sans-serif;
          font-size: 16px;
          color: var(--muted);
          width: 20px;
          text-align: center;
        }

        .lb-rank.gold { color: var(--amber); }
        .lb-name { flex: 1; color: var(--text); }
        .lb-pts { font-weight: 600; color: var(--green); font-size: 13px; }
        .lb-pts.dim { color: var(--muted); font-weight: 400; }

        .lb-row.highlight { background: var(--green-dim); border-radius: 8px; padding: 9px 8px; border-color: transparent; }

        .save-row {
          display: flex;
          gap: 8px;
          margin: 16px 0;
        }

        .save-input {
          flex: 1;
          background: var(--surface2);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 11px 14px;
          color: var(--text);
          font-family: 'DM Sans', sans-serif;
          font-size: 13px;
          outline: none;
          transition: border-color 0.15s;
        }

        .save-input:focus { border-color: var(--green); }

        .save-btn {
          background: var(--green);
          color: #000;
          border: none;
          border-radius: 10px;
          padding: 11px 18px;
          font-family: 'DM Sans', sans-serif;
          font-size: 13px;
          font-weight: 600;
          cursor: pointer;
        }

        .play-again-btn {
          width: 100%;
          background: transparent;
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 14px;
          color: var(--muted);
          font-family: 'DM Sans', sans-serif;
          font-size: 14px;
          cursor: pointer;
          transition: all 0.15s;
        }

        .play-again-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

        .error-msg {
          font-size: 12px;
          color: var(--red);
          text-align: center;
          margin-top: 8px;
          min-height: 16px;
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(6px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .fade-in { animation: fadeIn 0.25s ease forwards; }
    </style>
</head>
<body>
<div class="app">

    <div class="logo">TuneGame</div>
    <div class="tagline">how well do you know your classic rock?</div>

    <!-- ── START SCREEN ── -->
    <div class="screen active" id="screen-start">
        <div class="start-card">
            <div>
                <div class="mode-label">question mode</div>
                <div class="mode-toggle">
                    <button class="mode-btn active" id="btn-mc">multiple choice</button>
                    <button class="mode-btn" id="btn-typed">typed answer</button>
                </div>
            </div>
            <div>
                <div class="mode-label">playback</div>
                <div class="mode-toggle">
                    <button class="mode-btn active" id="btn-clip">clip (30s)</button>
                    <button class="mode-btn" id="btn-full">full song</button>
                </div>
            </div>
            <div>
                <div class="mode-label">song source</div>
                <div class="playlist-status" id="playlist-status">Using the built-in classic rock list</div>
                <div class="playlist-row">
                    <input class="typed-input" id="playlist-url" placeholder="paste a Spotify playlist link..."/>
                    <select id="saved-playlists">
                        <option value="">Default playlist</option>

                    </select>
                    <button class="submit-btn" id="playlist-load-btn">load</button>
                    <button id="delete-playlist-btn" type="button">
                        Delete playlist
                    </button>
                </div>
                <button class="mode-btn" id="btn-default-list" style="width:100%;margin-top:8px" disabled>use built-in list</button>
                <div class="playlist-msg" id="playlist-msg"></div>
                <div class="playlist-hint">Works with playlists you created or collaborate on. In Spotify: playlist menu, Share, Copy link.</div>
            </div>
            <button class="start-btn" id="start-button">play</button>
            <div class="error-msg" id="start-error"></div>
        </div>
    </div>

    <!-- ── GAME SCREEN ── -->
    <div class="screen" id="screen-game">
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-val" id="stat-score">0</div>
                <div class="stat-lbl">score</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="stat-streak">0</div>
                <div class="stat-lbl">streak</div>
            </div>
            <div class="stat-card">
                <div class="lives-dots" id="lives-dots"></div>
                <div class="stat-lbl">lives</div>
            </div>
        </div>

        <div class="timer-track">
            <div class="timer-bar" id="timer-bar" style="width:100%"></div>
        </div>

        <div class="album-wrap">
            <div class="album-placeholder" id="album-placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
                    <path d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"/>
                </svg>
            </div>
            <img class="album-img" id="album-img" alt="album art"/>
            <div class="now-playing" id="now-playing" style="display:none">
                <div class="pulse"></div>
                now playing
            </div>
        </div>

        <div class="question-text" id="question-text"></div>

        <div class="choices" id="choices-wrap"></div>

        <div class="typed-wrap" id="typed-wrap" style="display:none">
            <input class="typed-input" id="typed-input" placeholder="type your answer..."/>
            <button class="submit-btn" id="typed-submit-btn">go</button>
        </div>

        <div class="result-banner" id="result-banner">
            <div class="result-title" id="result-title"></div>
            <div class="result-sub" id="result-sub"></div>
        </div>

        <button class="next-btn" id="next-btn">next question →</button>
        <div class="error-msg" id="game-error"></div>
    </div>

    <!-- ── GAME OVER SCREEN ── -->
    <div class="screen" id="screen-gameover">
        <div class="gameover-card">
            <div class="gameover-header">
                <div class="gameover-title">game over</div>
                <div class="gameover-score" id="final-score">0</div>
                <div class="gameover-sub" id="final-sub"></div>

            <div class="leaderboard-title">leaderboard</div>
            <div id="leaderboard-list"></div>

            <div class="save-row">
                <input class="save-input" id="save-name" placeholder="your name..." maxlength="20"/>
                <button class="save-btn" id="save-score-btn">save</button>
            </div>

            <button class="play-again-btn" id="play-again-btn">play again</button>
            <div class="error-msg" id="gameover-error"></div>
        </div>
    </div>

</div>

<script src="shared.js"></script>
</body>
</html>
