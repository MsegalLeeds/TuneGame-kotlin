name: Release checks
on:
  pull_request:
  push:
    branches: [main, codex/release-readiness]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package the public web app
        run: ./gradlew :server:test :shared:jvmTest :shared:jsBrowserTest :server:distZip :server:installDist --no-daemon
      - name: Smoke test the packaged application
        run: python3 scripts/smoke_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: tunegame-server
          path: server/build/distributions/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            server/build/reports/tests/
            shared/build/reports/tests/
