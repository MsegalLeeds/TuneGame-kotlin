name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run server tests
        run: ./gradlew :server:test :shared:jvmTest

      - name: Run shared browser tests
        run: ./gradlew :shared:jsBrowserTest

      - name: Build production browser
        run: ./gradlew :shared:jsBrowserDistribution

      - name: Build server distribution
        run: ./gradlew :server:installDist :server:distZip

      - name: Smoke test installed release
        run: python3 scripts/smoke_release.py

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: tunegame-server
          path: server/build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            server/build/reports/tests/
            shared/build/reports/tests/
